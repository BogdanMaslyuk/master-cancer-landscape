[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcl-explorer-api"
version = "0.1.0"
description = "Read-only FastAPI layer for Master Cancer Landscape Explorer"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pandas>=2.2,<3",
  "pyarrow>=17,<22",
  "PyYAML>=6,<7",
  "pydantic>=2.8,<3",
  "scipy>=1.13,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["mcl_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
