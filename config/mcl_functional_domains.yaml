  - id: translation_ribosome
    label_ru: Трансляция и рибосома
    label_en: Translation and ribosome
    keywords: [translation, ribosome, ribosomal, aminoacyl-trna, trna charging]

  - id: proteostasis
    label_ru: Протеостаз
    label_en: Proteostasis
