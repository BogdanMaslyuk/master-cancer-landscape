version: "0.2"
status: provenance_aware_rule_based_projection
purpose: >-
  Human-readable multi-label functional groupings for MCL Gene Explorer. Groupings
  are assigned only when an existing formal source term matches an explicit rule.
  These rules do not create a biological annotation in the absence of a source term.
provenance_note: >-
  Formal source term IDs/names are retained alongside every MCL assignment. Domain,
  protein-class, compartment and Hallmark layers are navigation/interpretation layers
  over formal annotations and must not be treated as independent primary evidence.

domains:
  - id: signaling
    label_ru: Сигнальная трансдукция
    label_en: Signal transduction
    keywords: [signaling, signal transduction, receptor signaling, receptor tyrosine kinase, mapk, erk, ras signal, pi3k, akt signal, mtor, jak-stat, jak stat, wnt signal, tgf-beta, tgf beta, hippo, notch, nf-kappa, nf-kb, aryl hydrocarbon, ahr signaling]
    subdomains:
      - id: ras_mapk
        label_ru: RAS–RAF–MEK–ERK
        keywords: [ras signaling, mapk, erk cascade, raf, mek]
      - id: pi3k_akt_mtor
        label_ru: PI3K–AKT–mTOR
        keywords: [pi3k, akt signaling, mtor]
      - id: jak_stat
        label_ru: JAK–STAT
        keywords: [jak-stat, jak stat, stat signaling]
      - id: ahr
        label_ru: AhR-сигналинг
        keywords: [aryl hydrocarbon, ahr signaling, xenobiotic receptor]

  - id: transcription
    label_ru: Транскрипция и регуляция генов
    label_en: Transcription and gene regulation
    keywords: [transcription, transcriptional, rna polymerase, gene expression, promoter]

  - id: epigenetics_chromatin
    label_ru: Эпигенетика и хроматин
    label_en: Epigenetics and chromatin
