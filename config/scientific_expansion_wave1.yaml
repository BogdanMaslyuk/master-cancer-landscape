version: "1.0"
depmap_release: "26Q1"
selection_basis: >-
  First biological-review wave from Cancer Context Registry v1. Only READY exact
  protein-change contexts classified as DRIVER_HOTSPOT_FIRST_REVIEW are included.
  No composite target score is used.
scientific_guardrails:
  - CRISPR knockout dependency is not equivalent to pharmacological inhibition.
  - Cell-line context is not patient prevalence or clinical efficacy.
  - Gene-wildtype comparator means no qualifying alteration under the registry discovery rules; it is an operational comparator, not proof of complete genetic wild type.
  - Allele-specific comparisons against other variants answer a different question from mutant-versus-wildtype comparisons.
contexts:
  - wave1_id: W1-001
    label: Melanoma — BRAF p.V600E
    oncotree_code: MEL
    gene: BRAF
    protein_change: p.V600E
    comparison_mode: vs_gene_wildtype
    expected_context_n: 41
    expected_comparator_n: 10
    comparison_role: primary_comparator

