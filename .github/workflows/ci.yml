name: MCL clean baseline

on:
  push:
    branches: [mcl-explorer-v0.1]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install locked Python packages
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install -c constraints/python-3.13.txt -e ".[dev,analysis]" -e "./apps/api[dev]"
          python -m pip check
      - name: PowerShell control syntax
        shell: pwsh
        run: |
          $scripts = @("scripts/dev-service.ps1", "scripts/dev-control.ps1", "scripts/dev-diagnostics.ps1", "scripts/run-pyz-e0.ps1", "scripts/run-pyz-e0-closeout.ps1")
          foreach ($path in $scripts) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Host ("{0}: {1}" -f $path, $_) }
              exit 1
            }
            Write-Host ("PowerShell syntax: PASS {0}" -f $path)
          }
      - name: Architecture v1 repository contract
        run: python ./scripts/verify_architecture_v1.py
      - name: Python dependency constraints
        run: python ./scripts/verify_python_constraints.py
      - name: Scientific core tests
        run: python -m pytest ./tests -q
      - name: API tests
        run: python -m pytest ./apps/api/tests -q
      - name: Generated API type contract
        run: python ./scripts/generate_frontend_api_types.py --check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/explorer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/explorer/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: E0 browser audit syntax
        run: node --check ../../scripts/pyz_e0_browser.cjs
      - name: TypeScript contract check
        run: npm run typecheck
      - name: Production build
        env:
          NEXT_PUBLIC_MCL_API_URL: http://127.0.0.1:8000
        run: npm run build
