[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "master-cancer-landscape"
version = "0.4.0"
description = "Reproducible evidence pipeline for Master Cancer Landscape"
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [{name = "Master Cancer Landscape project"}]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "typer>=0.12,<1",
  "pandas>=2.2,<3",
  "pyarrow>=17,<22",
]

[project.optional-dependencies]
analysis = ["scipy>=1.13,<2", "statsmodels>=0.14,<1", "duckdb>=1.1,<2"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.8,<1"]

[project.scripts]
mcl = "mcl.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
